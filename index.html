<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Finanzas</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--ing:#16a34a;--gas:#dc2626;--pri:#0f766e;--bd:#e5e7eb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1316;--card:#1a2025;--tx:#eef1f4;--mut:#9aa4af;--bd:#2a323a}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--pri);color:#fff}
header h1{font-size:18px;margin:0}
header button{background:none;border:0;color:#fff;font-size:22px}
main{flex:1;overflow-y:auto;padding:16px}
.vista{display:none}.vista.activa{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;margin:12px 0 4px}
input,select{width:100%;padding:14px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
.btn{width:100%;padding:16px;margin-top:14px;font-size:16px;font-weight:600;border:0;border-radius:12px;background:var(--pri);color:#fff}
#msg{margin-top:12px;font-size:15px}
.ok{color:var(--ing)}.err{color:var(--gas)}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:10px 0;border:0;background:none;color:var(--mut);font-size:11px}
nav button span{display:block;font-size:22px}
nav button.activa{color:var(--pri);font-weight:700}

.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-weight:600;font-size:16px}
.seg .g.activa{border-color:var(--gas);color:var(--gas)}
.seg .i.activa{border-color:var(--ing);color:var(--ing)}

.fila{display:flex;gap:8px;margin-top:8px}.fila>*{flex:1}.fila button{flex:0}
.mov{display:flex;justify-content:space-between;gap:8px;padding:14px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.mov .v{font-weight:700;white-space:nowrap}.v.i{color:var(--ing)}.v.g{color:var(--gas)}
.chip{font-size:11px;background:#f59e0b;color:#fff;border-radius:8px;padding:1px 6px;margin-left:6px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;align-items:flex-end}
#modal.abierto{display:flex}
.hoja{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.btn.sec{background:var(--bd);color:var(--tx)}.btn.del{background:var(--gas)}
</style></head>
<body>
<header><h1 id="titulo">Inicio</h1><button id="bAjustes" aria-label="Ajustes">⚙️</button></header>
<main>
  <section class="vista" id="inicio">
    <div class="card"><b>Estado de la conexión</b><p id="estado" class="mut">Verificando…</p></div>
    <div class="card mut">El panel financiero se construye en la etapa 8.</div>
  </section>
  <section class="vista" id="registrar">
    <div class="seg"><button id="sg" class="g activa">Gasto</button><button id="si" class="i">Ingreso</button></div>
    <div class="card" style="margin-top:12px">
      <label for="fFecha">Fecha</label><input id="fFecha" type="date">
      <label for="fDesc">Descripción</label><input id="fDesc" type="text" autocomplete="off">
      <label for="fCat">Categoría</label><select id="fCat"></select>
      <div class="g-only"><label for="fSub">Subcategoría</label><input id="fSub" list="subs" autocomplete="off"><datalist id="subs"></datalist></div>
      <label for="fValor">Valor (COP)</label><input id="fValor" type="text" inputmode="numeric" placeholder="0">
      <div class="g-only"><label for="fMedio">Medio de pago</label>
        <select id="fMedio"></select>
        <label for="fTipoG">Tipo de gasto</label>
        <select id="fTipoG"><option>Variable</option><option>Fijo</option><option>Extraordinario</option></select></div>
      <div class="i-only" style="display:none"><label for="fCuenta">Cuenta o medio de recepción</label><input id="fCuenta" list="cuentas" autocomplete="off"><datalist id="cuentas"><option>Efectivo</option><option>Nequi</option><option>Daviplata</option><option>Bancolombia</option><option>Davivienda</option><option>Otro banco</option></datalist></div>
      <label for="fEstado">Estado</label><select id="fEstado"><option>Realizado</option><option>Pendiente</option></select>
      <label for="fObs">Observaciones</label><input id="fObs" type="text" autocomplete="off">
      <button class="btn" id="bGuardar">Guardar</button>
      <div id="msgR"></div>
    </div>
  </section>
  <section class="vista" id="movimientos">
    <div class="card">
      <input id="mQ" type="search" placeholder="Buscar por descripción">
      <div class="fila"><input id="mMes" type="month"><button class="btn sec" id="mTodo" style="width:auto;margin:0;padding:0 16px">Todo</button></div>
      <div class="fila"><select id="mTipo"><option value="">Ingresos y gastos</option><option value="INGRESOS">Ingresos</option><option value="GASTOS">Gastos</option></select>
      <select id="mCat"><option value="">Todas las categorías</option></select></div>
    </div>
    <p id="mTot" class="mut"></p>
    <div id="lista"></div>
  </section>
  <section class="vista" id="presupuesto"><div class="card mut">Presupuestos y obligaciones se construyen en la etapa 9.</div></section>
  <section class="vista" id="informes"><div class="card mut">Los informes se construyen en la etapa 8.</div></section>
  <section class="vista" id="ajustes">
    <div class="card">
      <b>Conexión con Google Sheets</b>
      <label for="url">URL del Web App (termina en /exec)</label>
      <input id="url" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/.../exec">
      <label for="token">Tu token personal</label>
      <input id="token" type="password" autocomplete="off">
      <button class="btn" id="bProbar">Guardar y probar conexión</button>
      <div id="msg"></div>
    </div>
    <p class="mut">Estos datos se guardan solo en este celular.</p>
  </section>
</main>
<nav>
  <button data-v="inicio"><span>🏠</span>Inicio</button>
  <button data-v="registrar"><span>➕</span>Registrar</button>
  <button data-v="movimientos"><span>📋</span>Movimientos</button>
  <button data-v="presupuesto"><span>🎯</span>Presupuesto</button>
  <button data-v="informes"><span>📊</span>Informes</button>
</nav>
<div id="modal"><div class="hoja"><h3 id="eTitulo"></h3><div id="eForm"></div>
  <button class="btn" id="eGuardar">Guardar cambios</button>
  <button class="btn sec" id="eCancelar">Cancelar</button>
  <button class="btn del" id="eEliminar">Eliminar</button></div></div>
<script>
const $=s=>document.querySelector(s);
const TIT={inicio:'Inicio',registrar:'Registrar',movimientos:'Movimientos',presupuesto:'Presupuesto',informes:'Informes',ajustes:'Ajustes'};
const cfg=()=>{try{return JSON.parse(localStorage.getItem('cfg'))||{}}catch(e){return{}}};

function ir(v){
  document.querySelectorAll('.vista').forEach(e=>e.classList.toggle('activa',e.id===v));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('activa',b.dataset.v===v));
  $('#titulo').textContent=TIT[v];if(v==='movimientos'&&cfg().url)cargarMovs();
}

async function api(accion,extra){
  const c=cfg();
  const r=await fetch(c.url,{method:'POST',body:JSON.stringify(Object.assign({token:c.token,accion:accion},extra||{}))});
  return r.json();
}

async function verificar(){
  const e=$('#estado');
  if(!cfg().url){e.className='mut';e.textContent='Sin configurar. Toca ⚙️ para conectar.';return false}
  try{
    const r=await api('ping');
    if(r.ok){e.className='ok';e.textContent='Conectado como '+r.usuario;return r}
    e.className='err';e.textContent=r.error||'Error de conexión';
  }catch(x){e.className='err';e.textContent='Sin conexión con el servidor'}
  return false;
}

$('#bProbar').onclick=async()=>{
  const m=$('#msg');
  localStorage.setItem('cfg',JSON.stringify({url:$('#url').value.trim(),token:$('#token').value.trim()}));
  m.className='';m.textContent='Probando…';
  const r=await verificar();
  if(r){m.className='ok';m.textContent='✔ Conectado como '+r.usuario}
  else{m.className='err';m.textContent='✖ '+$('#estado').textContent}
};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>ir(b.dataset.v));
$('#bAjustes').onclick=()=>ir('ajustes');

$('#url').value=cfg().url||'';
$('#token').value=cfg().token||'';
if(cfg().url){ir('inicio');verificar()}else{ir('ajustes');verificar()}

const MEDIOS=['Efectivo','Transferencia Nequi','Transferencia Daviplata','Transferencia Bancolombia','Transferencia Davivienda','Transferencia otro banco','Tarjeta débito','Tarjeta crédito'];
document.querySelector('#fMedio').innerHTML=MEDIOS.map(o=>'<option>'+o+'</option>').join('');
/* ===== Etapa 6: formularios ===== */
let tipoReg='Gasto',cats=[],sincronizando=false;
const hoy=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const cop=n=>'$ '+Number(n).toLocaleString('es-CO');
const leerCola=()=>JSON.parse(localStorage.getItem('cola')||'[]');

async function cargarCats(){
  try{const r=await api('listar',{hoja:'CATEGORÍAS'});if(r.ok){cats=r.datos;localStorage.setItem('cats',JSON.stringify(cats))}}catch(e){}
  if(!cats.length)cats=JSON.parse(localStorage.getItem('cats')||'[]');
  pintarCats();
}
function pintarCats(){
  const nombres=[...new Set(cats.filter(c=>c.Tipo===tipoReg&&c.Activa==='SÍ').map(c=>c['Categoría']))];
  $('#fCat').innerHTML=nombres.map(n=>'<option>'+n+'</option>').join('');
  pintarSubs();
}
function pintarSubs(){
  const c=$('#fCat').value;
  $('#subs').innerHTML=cats.filter(x=>x.Tipo==='Gasto'&&x['Categoría']===c&&x['Subcategoría']).map(x=>'<option value="'+x['Subcategoría']+'">').join('');
}
function setTipo(t){
  tipoReg=t;
  document.querySelectorAll('.g-only').forEach(e=>e.style.display=t==='Gasto'?'':'none');
  document.querySelectorAll('.i-only').forEach(e=>e.style.display=t==='Ingreso'?'':'none');
  $('#sg').classList.toggle('activa',t==='Gasto');$('#si').classList.toggle('activa',t==='Ingreso');
  pintarCats();
}
async function sync(){
  if(sincronizando)return leerCola().length;
  sincronizando=true;
  try{
    let cola=leerCola();
    while(cola.length){
      const r=await api('agregar',{hoja:cola[0].hoja,datos:cola[0].datos});
      if(!r.ok)break;
      cola.shift();localStorage.setItem('cola',JSON.stringify(cola));
    }
  }catch(e){}
  sincronizando=false;
  return leerCola().length;
}
$('#sg').onclick=()=>setTipo('Gasto');
$('#si').onclick=()=>setTipo('Ingreso');
$('#fCat').onchange=pintarSubs;
$('#fValor').oninput=e=>{const d=e.target.value.replace(/\D/g,'');e.target.value=d?Number(d).toLocaleString('es-CO'):''};
$('#bGuardar').onclick=async()=>{
  const m=$('#msgR'),valor=Number($('#fValor').value.replace(/\D/g,''));
  if(!$('#fDesc').value.trim()||!valor||!$('#fCat').value){m.className='err';m.textContent='Completa descripción, categoría y valor.';return}
  const g=tipoReg==='Gasto';
  const datos={ID:crypto.randomUUID(),Fecha:$('#fFecha').value,'Descripción':$('#fDesc').value.trim(),'Categoría':$('#fCat').value,Valor:valor,Observaciones:$('#fObs').value.trim(),Estado:$('#fEstado').value};
  if(g){datos['Subcategoría']=$('#fSub').value.trim();datos['Medio de pago']=$('#fMedio').value;datos.Tipo=$('#fTipoG').value}
  else datos.Cuenta=$('#fCuenta').value.trim();
  const cola=leerCola();cola.push({hoja:g?'GASTOS':'INGRESOS',datos:datos});
  localStorage.setItem('cola',JSON.stringify(cola));
  ['#fDesc','#fValor','#fSub','#fObs'].forEach(i=>$(i).value='');
  m.className='';m.textContent='Guardando…';
  const pend=await sync();
  if(pend){m.className='';m.textContent='Guardado en el celular. Se enviará al volver el internet ('+pend+' pendiente/s).'}
  else{m.className='ok';m.textContent='✔ '+(g?'Gasto':'Ingreso')+' guardado: '+cop(valor)}
};
$('#bProbar').addEventListener('click',()=>setTimeout(()=>{cargarCats();sync()},1500));
window.addEventListener('online',sync);
$('#fFecha').value=hoy();
if(cfg().url){cargarCats();sync()}

/* ===== Etapa 7: movimientos ===== */
let movs=[],editando=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function fmtNum(el){const d=el.value.replace(/\D/g,'');el.value=d?Number(d).toLocaleString('es-CO'):''}
const EST=['Realizado','Pendiente'];
const CAMPOS={
  GASTOS:[['Fecha','date'],['Descripción','text'],['Categoría','cat'],['Subcategoría','text'],['Valor','num'],['Medio de pago',MEDIOS],['Tipo',['Variable','Fijo','Extraordinario']],['Estado',EST],['Observaciones','text']],
  INGRESOS:[['Fecha','date'],['Descripción','text'],['Categoría','cat'],['Valor','num'],['Cuenta','text'],['Estado',EST],['Observaciones','text']]
};

async function cargarMovs(){
  const l=$('#lista');l.innerHTML='<p class="mut">Cargando…</p>';
  try{
    const r=await Promise.all([api('listar',{hoja:'INGRESOS'}),api('listar',{hoja:'GASTOS'})]);
    if(!r[0].ok||!r[1].ok)throw new Error('listar');
    movs=r[0].datos.map(x=>Object.assign(x,{_h:'INGRESOS'})).concat(r[1].datos.map(x=>Object.assign(x,{_h:'GASTOS'})));
    movs.sort((x,y)=>(String(y.Fecha)+String(y.Creado)).localeCompare(String(x.Fecha)+String(x.Creado)));
    const sel=$('#mCat'),act=sel.value;
    sel.innerHTML='<option value="">Todas las categorías</option>'+[...new Set(movs.map(m=>m['Categoría']))].map(c=>'<option'+(c===act?' selected':'')+'>'+esc(c)+'</option>').join('');
    pintarMovs();
  }catch(e){l.innerHTML='<p class="err">No se pudieron cargar los movimientos. Revisa tu conexión.</p>'}
}

function pintarMovs(){
  const q=norm($('#mQ').value),t=$('#mTipo').value,c=$('#mCat').value,mes=$('#mMes').value;
  const f=movs.filter(m=>(!q||norm(m['Descripción']).includes(q))&&(!t||m._h===t)&&(!c||m['Categoría']===c)&&(!mes||String(m.Fecha).slice(0,7)===mes));
  let ing=0,gas=0;
  f.forEach(m=>{if(m.Estado!=='Pendiente'){if(m._h==='INGRESOS')ing+=Number(m.Valor);else gas+=Number(m.Valor)}});
  $('#mTot').innerHTML='Ingresos <b class="ok">'+cop(ing)+'</b> · Gastos <b class="err">'+cop(gas)+'</b> · '+f.length+' mov. (sin contar pendientes)';
  $('#lista').innerHTML=f.map(m=>{
    const i=m._h==='INGRESOS';
    return '<div class="mov" data-i="'+movs.indexOf(m)+'"><div><b>'+esc(m['Descripción'])+'</b>'+(m.Estado==='Pendiente'?'<span class="chip">Pendiente</span>':'')+
      '<div class="mut">'+esc(m['Categoría'])+' · '+esc(m.Fecha)+' · '+esc(m['Registrado por'])+'</div></div>'+
      '<div class="v '+(i?'i':'g')+'">'+(i?'+':'−')+cop(m.Valor)+'</div></div>';
  }).join('')||'<p class="mut">Sin movimientos con esos filtros.</p>';
}

function abrirEdicion(m){
  editando=m;
  const g=m._h==='GASTOS';
  $('#eTitulo').textContent=g?'Editar gasto':'Editar ingreso';
  $('#eForm').innerHTML=CAMPOS[m._h].map((c,i)=>{
    const n=c[0],t=c[1],v=m[n]==null?'':m[n],id='e'+i;
    let inp;
    if(t==='date')inp='<input type="date" id="'+id+'" value="'+esc(v)+'">';
    else if(t==='num')inp='<input type="text" inputmode="numeric" id="'+id+'" value="'+Number(v).toLocaleString('es-CO')+'" oninput="fmtNum(this)">';
    else if(t==='cat'){
      const op=[...new Set(cats.filter(x=>x.Tipo===(g?'Gasto':'Ingreso')&&x.Activa==='SÍ').map(x=>x['Categoría']).concat([v]))];
      inp='<select id="'+id+'">'+op.map(o=>'<option'+(o===v?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
    }
    else if(Array.isArray(t))inp='<select id="'+id+'">'+(v&&t.indexOf(v)<0?t.concat([v]):t).map(o=>'<option'+(o===v?' selected':'')+'>'+o+'</option>').join('')+'</select>';
    else inp='<input type="text" id="'+id+'" value="'+esc(v)+'">';
    return '<label for="'+id+'">'+n+'</label>'+inp;
  }).join('');
  $('#modal').classList.add('abierto');
}
const cerrarEdicion=()=>{$('#modal').classList.remove('abierto');editando=null};

$('#lista').onclick=e=>{const d=e.target.closest('[data-i]');if(d)abrirEdicion(movs[+d.dataset.i])};
$('#eCancelar').onclick=cerrarEdicion;
$('#eGuardar').onclick=async()=>{
  const m=editando,datos={};
  CAMPOS[m._h].forEach((c,i)=>{let v=$('#e'+i).value;if(c[1]==='num')v=Number(v.replace(/\D/g,''));datos[c[0]]=v});
  if(!datos.Valor||!String(datos['Descripción']).trim()||!datos.Fecha){alert('Fecha, descripción y valor son obligatorios.');return}
  try{
    const r=await api('actualizar',{hoja:m._h,id:m.ID,datos:datos});
    if(!r.ok)throw new Error(r.error);
    Object.assign(m,datos);cerrarEdicion();pintarMovs();
  }catch(e){alert('No se pudo guardar. Revisa tu conexión.')}
};
$('#eEliminar').onclick=async()=>{
  if(!confirm('¿Eliminar este movimiento?'))return;
  try{
    const r=await api('eliminar',{hoja:editando._h,id:editando.ID});
    if(!r.ok)throw new Error(r.error);
    movs.splice(movs.indexOf(editando),1);cerrarEdicion();pintarMovs();
  }catch(e){alert('No se pudo eliminar. Revisa tu conexión.')}
};
$('#mQ').oninput=pintarMovs;
['#mMes','#mTipo','#mCat'].forEach(i=>$(i).onchange=pintarMovs);
$('#mTodo').onclick=()=>{$('#mMes').value='';pintarMovs()};
$('#mMes').value=hoy().slice(0,7);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
